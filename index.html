<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 9 Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .profile-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 250px; font-family: sans-serif; background: #fff; color: #333; }
      .profile-card img { width: 100px; height: 100px; border-radius: 50%; }
      button { margin: 5px 2px; padding: 5px 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const userData = {
        name: "Elmer Alvarado",
        avatarUrl: "https://i.pravatar.cc/100",
        bio: "Appdev1 instructor.",
        skills: ["React", "JavaScript", "HTML", "CSS"],
        isOnline: true,
        lastUpdated: "2 hours ago",
      };

      function UserProfileCard({ user = userData }) {
        const [messageCount, setMessageCount] = useState(0);

        function handleSendMessage() {
          setMessageCount(messageCount + 1);
        }

        function handleReset() {
          setMessageCount(0);
        }

        return (
          <React.Fragment>
            <div className="profile-card">
              <img src={user.avatarUrl} alt={user.name} />
              <h2>{user.name}</h2>

              <label htmlFor="bio">Bio</label>
              <p id="bio">{user.bio}</p>

              <h3>Skills</h3>
              <ul>
                {user.skills.map((skill, index) => (
                  <li key={index}>{skill}</li>
                ))}
              </ul>

              <div style={{ color: 'blue', fontWeight: 'bold' }}>
                Messages sent: {messageCount}
              </div>

              {user.isOnline ? <span>🟢 Online</span> : <span>⚪ Offline</span>}

              <br />

              <button onClick={handleSendMessage}>Send Message</button>
              <button onClick={handleReset}>Reset</button>
            </div>

            <p className="footer">Card last updated: {user.lastUpdated}</p>
          </React.Fragment>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<UserProfileCard />);
    </script>
  </body>
</html>
