<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 9 Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f9;
      }
      .profile-card {
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
        width: 280px;
        background: #ffffff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .profile-card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }
      button {
        margin: 5px 4px 5px 0;
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #999;
      }
      .footer {
        font-size: 12px;
        color: #666;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const userData = {
        name: "Janice V. Agnote",
        avatarUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
        bio: "Appdev1 student.",
        skills: ["Problem Solving", "Coffee Drinking", "Debugging", "Procrastination"],
        isOnline: true,
        lastUpdated: "1 minute ago",
      };

      function UserProfileCard({ user = userData }) {
        const [messageCount, setMessageCount] = useState(0);
        const [isFavorited, setIsFavorited] = useState(false);

        function handleSendMessage() {
          setMessageCount(messageCount + 1);
        }

        function handleReset() {
          setMessageCount(0);
        }

        function handleToggleFavorite() {
          setIsFavorited((prev) => !prev);
        }

        return (
          <React.Fragment>
            <div className="profile-card">
              <img src={user.avatarUrl} alt={user.name} />
              <h2>{user.name}</h2>

              <label htmlFor="bio">Bio</label>
              <p id="bio">{user.bio}</p>

              <h3>Skills</h3>
              <ul>
                {user.skills.map((skill, index) => (
                  <li key={index}>{skill}</li>
                ))}
              </ul>

              <div style={{ color: 'blue', fontWeight: 'bold' }}>
                Messages sent: {messageCount}
              </div>

              {user.isOnline ? <span>🟢 Online </span> : <span>⚪ Offline </span>}

              {user.isOnline && (
                <button onClick={handleToggleFavorite}>
                  {isFavorited ? "★ Favorited" : "☆ Favorite"}
                </button>
              )}

              <button onClick={handleSendMessage}>Send Message</button>
              <button onClick={handleReset}>Reset</button>
            </div>

            <p className="footer">Card last updated: {user.lastUpdated}</p>
          </React.Fragment>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<UserProfileCard />);
    </script>
  </body>
</html>
